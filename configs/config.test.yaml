app:
  env: test
  port: 8080
  verify_base_url: "http://localhost:8080"
  jwt_secret: "test-jwt-secret-change-in-prod"

database:
  dsn: "postgres://user:pass@localhost:5432/eds_test?sslmode=disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime_sec: 300

ncanode:
  url: "http://localhost:14579"
  timeout_sec: 30

storage:
  endpoint: "http://localhost:9000"
  region: "us-east-1"
  bucket: "eds-test"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_path_style: true    # true для MinIO, false для AWS S3

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  webhook_queue: "webhook.delivery"
  event_exchange: "eds.events"
  prefetch_count: 5

log:
  level: "debug"
  format: "console"   # "console" для разработки, "json" для prod

rate_limit:
  verify_per_minute: 60
  api_per_minute: 300

applications:
  fetch_interval_sec: 10
  fetch_batch_size: 20
  max_fetch_retries: 3
  webhook_interval_sec: 5
  webhook_max_attempts: 5

cleanup:
  cleanup_interval_sec: 600    # 10 minutes
  cache_ttl_sec: 86400         # 24 hours
