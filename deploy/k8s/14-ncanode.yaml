# NCANode 3 — sidecar для CMS/OCSP/TSP.
#
# Особенность НУЦ РК: старые URL для root CA (pki.gov.kz/cert/*.cer) больше
# не отвечают — сайт мигрирован на WordPress, /cert/* → 404. NCANode на
# проде (VPS 77.42.30.254) работает потому что 6 CA-файлов были скачаны
# заранее и лежат в persistent volume /app/cache/ca/. Дальше NCANode
# читает CDP extensions из этих CA и качает актуальные CRL c
# crl.pki.gov.kz/nca_d_*.crl самостоятельно — наши NCANODE_CRL_URL не
# нужны и даже вредны (устаревшие пути → download failure).
#
# Здесь bootstrap-CA — из ConfigMap `ncanode-ca-bootstrap` (6 файлов,
# ~7 KB), скопированных с прода. Init-container кладёт их в /app/cache/ca/
# перед запуском Spring Boot.
#
# NCANODE_CA_URL и NCANODE_CRL_URL НЕ задаём — как на проде.
---
apiVersion: v1
kind: Service
metadata:
  name: ncanode
  namespace: platform
  labels: { app: ncanode }
spec:
  selector: { app: ncanode }
  ports:
    - { name: http, port: 14579, targetPort: 14579 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncanode
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: ncanode }
  template:
    metadata:
      labels: { app: ncanode }
    spec:
      # k8s service-link env (NCANODE_PORT=tcp://...) ломает Spring Boot,
      # который читает свой NCANODE_PORT как server.port (Integer).
      enableServiceLinks: false
      initContainers:
        # Копируем bootstrap CA-набор из ConfigMap ncanode-ca-bootstrap
        # в /app/cache/ca/. NCANode дальше сам обновляет CRL через
        # CDP extensions в этих CA.
        - name: ca-bootstrap
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /cache/ca
              cp /bootstrap/*.cer /cache/ca/
              echo "seeded /cache/ca:"
              ls -la /cache/ca/
          volumeMounts:
            - { name: cache, mountPath: /cache }
            - { name: ca-bootstrap, mountPath: /bootstrap, readOnly: true }
      containers:
        - name: ncanode
          image: malikzh/ncanode:latest
          imagePullPolicy: IfNotPresent
          env:
            # Явно фиксируем порт сервера NCANode — иначе Spring читает Service
            # link NCANODE_PORT (URL) и крашится с NumberFormatException.
            - { name: NCANODE_PORT,    value: "14579" }
            # DEBUG=true: с false NCANode не пишет в лог НИЧЕГО. Инцидент
            # 2026-07-08…10 (залипший пул исходящих соединений) пришлось
            # диагностировать вслепую, по /proc/net/tcp.
            - { name: NCANODE_DEBUG,   value: "true" }
            - { name: NCANODE_OCSP_URL, value: "http://ocsp.pki.gov.kz/" }
            - { name: NCANODE_TSP_URL,  value: "http://tsp.pki.gov.kz/" }
            # JVM по умолчанию берёт 25% контейнерной памяти под heap, что
            # для NCANode + Spring + Tomcat + CRL cache недостаточно и даёт
            # OOM на первом полле scheduler'а. Явно задаём 75% от лимита
            # (~1152 MiB heap при 1536 MiB контейнера).
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0" }
            # NCANODE_CA_URL и NCANODE_CRL_URL намеренно НЕ заданы — как на
            # проде. NCANode использует bootstrap-CA из /app/cache/ca (см.
            # initContainer) + автогенерит CRL URLs из CDP extension.
          ports:
            - { name: http, containerPort: 14579 }
          readinessProbe:
            tcpSocket: { port: 14579 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          # Детектор залипания NCANode.
          #
          # Инцидент 2026-07-08…10: за ~3 суток аптайма NCANode перестал
          # закрывать исходящие соединения к серверам НУЦ РК, его пул
          # исчерпался, и КАЖДЫЙ POST /cms/verify стал висеть >30 с
          # (`context deadline exceeded` на стороне Chandra). Подписание
          # встало полностью. Рестарт пода чинит: тот же CMS проверяется
          # за 1.6 с вместо 90 с.
          #
          # Почему не tcpSocket и не `GET /`: на залипшем сервисе порт открыт,
          # корень отдаёт 200, а POST с пустым телом — быстрый 400 (валидация
          # идёт до обращения к сети). Ни одна дешёвая проба залипание не видит.
          # Функциональная проба (реальный POST /cms/verify) потребовала бы
          # хранить в кластере настоящий CMS с ПДн подписанта — не делаем.
          #
          # Считаем ВХОДЯЩИЕ сокеты в CLOSE_WAIT (st=08) на порту 14579
          # (hex 38F3). Это прямой симптом: клиент отвалился по таймауту, а
          # NCANode свою сторону не закрыл. На здоровом сервисе их 0–3;
          # в момент инцидента было 16 и росло с каждым запросом.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  n=$(awk 'FNR>1 && $4=="08" && $2 ~ /:38F3$/ {c++} END{print c+0}' \
                        /proc/net/tcp /proc/net/tcp6 2>/dev/null)
                  echo "close_wait_inbound=$n"
                  [ "$n" -lt 10 ]
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # На VPS NCANode держит ~390Mi steady + jvm heap растёт со временем.
            # 768Mi лимит вызывал OOM при инициализации CRL cache. Ставим 1.5Gi.
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1536Mi" }
          volumeMounts:
            - { name: cache, mountPath: /app/cache }
      volumes:
        - name: cache
          emptyDir: {}
        - name: ca-bootstrap
          configMap:
            name: ncanode-ca-bootstrap
