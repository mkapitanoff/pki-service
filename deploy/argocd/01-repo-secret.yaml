# Argo CD repository credential для core/pki. По шаблону core/iam/deploy/argocd/04-repo-secret.yaml.
#
# Применять:
#   kubectl -n argocd apply -f deploy/argocd/01-repo-secret.yaml
# (предварительно подставив реальный токен из Vaultwarden → fin4b/platform/argocd)
#
# Scope токена: read_repository достаточно. Лучше выпустить отдельный Project Access
# Token у core/pki (Settings → Access Tokens), чтобы при ротации не зацепить другие проекты.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-pki-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://gitlab.fin4b.kz/core/pki.git
  username: argocd
  password: <GITLAB_PROJECT_ACCESS_TOKEN>  # из Vaultwarden → fin4b/platform/argocd
